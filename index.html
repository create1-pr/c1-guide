<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>C1アプリ 使い方ガイド</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF0F4; --surface:#FFFFFF; --ink:#14161F; --ink2:#4B5160; --muted:#8A909E;
  --line:#E6E8EE; --line2:#EFF1F5;
  --shadow:0 1px 2px rgba(20,22,31,.05),0 6px 20px rgba(20,22,31,.06);
  --shadow-sm:0 1px 2px rgba(20,22,31,.06);
  --radius:18px; --radius-sm:12px;
  --disp:"Zen Kaku Gothic New",system-ui,sans-serif;
  --body:"Noto Sans JP",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{font-family:var(--body);color:var(--ink);line-height:1.7;
  font-feature-settings:"palt";-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
.app{max-width:468px;margin:0 auto;min-height:100dvh;background:var(--bg);
  position:relative;overflow-x:hidden}
@media(min-width:520px){
  html,body{background:#DFE2E9}
  .app{margin:22px auto;height:calc(100dvh - 44px);border-radius:30px;
    box-shadow:0 24px 60px rgba(20,22,31,.14);overflow-y:auto;overflow-x:hidden;
    border:1px solid #e2e4ea;scrollbar-width:thin}
}

/* accent themes */
[data-accent="amber"]{--ac:#C9821F;--ac-soft:#FaF1E2;--ac-ink:#734711}
[data-accent="indigo"]{--ac:#3A56C8;--ac-soft:#EBEEFB;--ac-ink:#293b8f}
[data-accent="green"]{--ac:#2C9E68;--ac-soft:#E8F4EC;--ac-ink:#1c6642}
[data-accent="slate"]{--ac:#586074;--ac-soft:#EDEFF3;--ac-ink:#39404f}
[data-accent="teal"]{--ac:#0E90A0;--ac-soft:#E3F2F4;--ac-ink:#0a5a64}

/* ---------- HOME ---------- */
.home{padding:0 0 40px}
.hero{padding:32px 22px 28px;background:linear-gradient(180deg,#171A26 0%,#1E2233 100%);color:#fff}
.hero .eyebrow{font:500 12px/1 var(--body);letter-spacing:.14em;color:#AEB6D0;
   text-transform:uppercase;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.hero .eyebrow b{color:#fff;font-weight:700;letter-spacing:.06em}
.hero h1{font-family:var(--disp);font-weight:900;font-size:27px;line-height:1.25;letter-spacing:.01em}
.hero p{margin-top:10px;color:#C3C9DC;font-size:13.5px;max-width:30ch}

.sec-label{font:700 11.5px/1 var(--body);letter-spacing:.12em;color:var(--muted);
   text-transform:uppercase;padding:26px 24px 12px}
.cards{display:flex;flex-direction:column;gap:11px;padding:0 16px}
.card{display:flex;align-items:center;gap:14px;background:var(--surface);
   border:1px solid var(--line);border-radius:var(--radius);padding:15px 15px;
   box-shadow:var(--shadow-sm);cursor:pointer;transition:transform .16s ease,box-shadow .16s ease;
   text-align:left;width:100%;font-family:inherit;color:inherit}
.card:active{transform:scale(.985)}
@media(hover:hover){.card:hover{box-shadow:var(--shadow);transform:translateY(-1px)}}
.card .chip{width:46px;height:46px;flex:0 0 46px;border-radius:13px;background:var(--ac-soft);
   display:grid;place-items:center;font-size:22px}
.card .tx{flex:1;min-width:0}
.card .tx h3{font-family:var(--disp);font-weight:700;font-size:16px;letter-spacing:.01em}
.card .tx small{display:block;color:var(--muted);font-size:12px;margin-top:2px;font-weight:500}
.card .go{color:var(--ac);flex:0 0 auto;display:grid;place-items:center;width:26px;height:26px}
.card .go svg{width:18px;height:18px}
.card.stub{opacity:.72}
.card.stub .badge{font-size:10px;font-weight:700;color:var(--muted);border:1px solid var(--line);
   padding:2px 7px;border-radius:999px;margin-left:auto;white-space:nowrap}

.foot{padding:26px 24px 10px;color:var(--muted);font-size:11px;text-align:center;line-height:1.6}

/* ---------- DETAIL ---------- */
.detail{display:none;animation:fade .22s ease both}
.detail.on{display:block}
.home.off{display:none}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:6px;
   padding:12px 12px;background:#ffffffd8;backdrop-filter:blur(12px);
   border-bottom:1px solid var(--line)}
.back{display:flex;align-items:center;gap:4px;border:none;background:none;cursor:pointer;
   font-family:inherit;color:var(--ac);font-weight:700;font-size:14px;padding:8px 8px 8px 4px;border-radius:10px}
.back:active{background:var(--ac-soft)}
.back svg{width:20px;height:20px}
.crumb-back{display:flex;align-items:center;gap:3px;border:none;background:none;cursor:pointer;flex:0 0 auto;
   font-family:inherit;color:var(--ac);font-weight:700;font-size:14px;padding:8px 6px 8px 4px;border-radius:10px}
.crumb-back:active{background:var(--ac-soft)}
.crumb-back svg{width:20px;height:20px}
.crumb-sep{color:var(--muted);font-size:15px;flex:0 0 auto}
.crumb-now{color:var(--ink);font-weight:700;font-family:var(--disp);font-size:14px;
   white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.d-head{padding:20px 22px 8px}
.d-head .ki{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:12px;
   background:var(--ac-soft);font-size:22px;margin-bottom:12px}
.d-head h2{font-family:var(--disp);font-weight:900;font-size:23px;letter-spacing:.01em}
.d-head .sub{color:var(--muted);font-size:12.5px;font-weight:500;margin-top:3px}
.d-body{padding:8px 16px 48px}
.topbar-search{margin-left:auto;flex:0 0 auto;width:36px;height:36px;border-radius:10px;border:none;
   background:none;color:var(--ink2);display:grid;place-items:center;cursor:pointer}
.topbar-search:active{background:var(--line2)}
.topbar-search svg{width:20px;height:20px}

.lead{color:var(--ink2);font-size:14.5px;padding:8px 6px 4px;line-height:1.75}
.subhead{font-family:var(--disp);font-weight:700;font-size:13px;color:var(--ink);margin:16px 2px 4px;display:flex;align-items:center;gap:6px}
.acc.locked>summary{pointer-events:none;cursor:default}
/* 意識づけブロック */
.intro,.cue{margin:0 0 10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.intro{margin-bottom:8px}
.intro>summary,.cue>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:13px 15px;font-family:var(--disp);font-weight:700;font-size:14px;color:var(--ink)}
.intro>summary::-webkit-details-marker,.cue>summary::-webkit-details-marker{display:none}
.intro .cv,.cue .cv{margin-left:auto;color:var(--muted);font-size:11px;transition:transform .2s}
.intro[open] .cv,.cue[open] .cv{transform:rotate(180deg)}
.pillars{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:2px 12px 14px}
.pillar{border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:12px 8px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:7px}
.pillar .pic{width:44px;height:44px;border-radius:12px;background:var(--surface);display:grid;place-items:center;font-size:22px;border:1px solid var(--line)}
.pillar b{font-size:12.5px;color:var(--ink);font-family:var(--disp);line-height:1.35}
.pbadge{font-size:10px;font-weight:700;padding:4px 9px;border-radius:999px;white-space:nowrap;margin-top:1px}
.pbadge.all{background:#E8F4EC;color:#1c6642}
.pbadge.inv{background:#FaF1E2;color:#8a5500}
.cue3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:2px 12px 12px}
.cue3 .cell{border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:12px 8px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px}
.cue3 .cell .ci{width:42px;height:42px;border-radius:12px;background:var(--surface);display:grid;place-items:center;font-size:21px;border:1px solid var(--line)}
.cue3 .cell b{font-size:12.5px;color:var(--ink);font-family:var(--disp);line-height:1.35}
.cue3 .cell span{font-size:10.5px;color:var(--ink2);line-height:1.45}
.cue-foot{margin:0 12px 13px;background:var(--ac-soft,#FaF1E2);border-radius:10px;padding:10px 12px;text-align:center;font-size:12px;font-weight:700;color:var(--ac-ink,#734711)}
.worry{padding:2px 13px 13px;display:flex;flex-direction:column;gap:8px}
.worry .wrow{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:11px;background:var(--bg);padding:11px}
.worry .wrow .we{font-size:17px;line-height:1.2}
.worry .wrow b{font-size:13px;color:var(--ink)}
.worry .wrow p{font-size:11.5px;color:var(--ink2);margin-top:2px;line-height:1.5}
.solve{border-radius:12px;background:var(--ac-soft,#E8F4EC);padding:12px;text-align:center;margin-top:2px}
.solve b{font-size:13.5px;color:var(--ac-ink,#1c6642);display:block}
.solve p{font-size:11.5px;color:var(--ac-ink,#1c6642);line-height:1.55;margin-top:5px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:2px 12px 12px}
.two .col{border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:12px 11px}
.two .col .hh{display:flex;align-items:center;gap:7px;margin-bottom:7px;font-size:12.5px;font-weight:700;color:var(--ink2)}
.two .col .hh .ce{width:26px;height:26px;border-radius:8px;background:var(--surface);display:grid;place-items:center;font-size:15px;border:1px solid var(--line)}
.two .col p{font-size:11.5px;color:var(--ink2);line-height:1.55}
.two .col.hl{border-color:var(--ac,#2C9E68);background:var(--ac-soft,#E8F4EC)}
.two .col.hl .hh,.two .col.hl p{color:var(--ac-ink,#1c6642)}
.two .col:has(.obadge){position:relative}
.two .col .obadge{position:absolute;top:-8px;right:8px;font-size:10px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--ac,#2C9E68);color:#fff;white-space:nowrap}
.two .col .rate{font-family:var(--disp);font-size:19px;font-weight:800;color:var(--ink);line-height:1.2}
.two .col.hl .rate{color:var(--ac-ink,#1c6642)}
.two .col .rmin{font-size:10.5px;font-weight:700;color:var(--muted);margin:3px 0 7px}
.two-foot{margin:0 12px 13px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;text-align:center;font-size:12.5px;font-weight:700;color:var(--ink)}
.lv{display:flex;flex-direction:column;gap:9px;margin-top:4px}
.lv .lrow{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:12px 13px}
.lv .lrow .lhh{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.lv .lrow .lhh .ls{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font-size:12px;font-weight:800}
.lv .lrow .lhh b{font-size:13.5px;color:var(--ink)}
.lv .lrow .lhh .lb{margin-left:auto;font-size:10px;font-weight:700;padding:3px 9px;border-radius:999px}
.lv .lrow p{font-size:11.5px;color:var(--ink2);line-height:1.5}
.lv .lrow .lsoon{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;padding:3px 9px;border-radius:999px;background:#EDEFF3;color:#39404f;line-height:1.6}

.grouphead{font-family:var(--disp);font-weight:800;font-size:15px;color:var(--ink);
   margin:24px 2px 2px;display:flex;align-items:center;gap:9px}
.grouphead::before{content:"";width:4px;height:16px;border-radius:2px;background:var(--ac)}
.tabwrap{position:sticky;top:51px;z-index:15;background:var(--bg);padding:10px 14px 6px}
.tabs{display:flex;gap:5px;background:#e3e6ec;padding:4px;border-radius:12px}
.tab{flex:1;border:none;background:none;font-family:var(--disp);font-weight:700;font-size:14px;
   color:var(--ink2);padding:9px 0;border-radius:9px;cursor:pointer}
.tab.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm)}
.tabpanel{display:none}
.tabpanel.on{display:block;animation:fade .18s ease both}

/* accordion */
.acc{background:var(--surface);border:1px solid var(--line);border-radius:14px;
   margin-top:12px;overflow:hidden;box-shadow:var(--shadow-sm)}
.acc>summary{list-style:none;cursor:pointer;padding:15px 16px;display:flex;align-items:center;gap:10px;
   font-family:var(--disp);font-weight:700;font-size:15px}
.acc>summary::-webkit-details-marker{display:none}
.acc>summary .dot{width:7px;height:7px;border-radius:50%;background:var(--ac);flex:0 0 auto}
.acc>summary .cv{margin-left:auto;transition:transform .2s ease;color:var(--muted);display:grid;place-items:center}
.acc>summary .cv svg{width:20px;height:20px}
.acc[open]>summary .cv{transform:rotate(180deg)}
.acc[open]>summary{border-bottom:1px solid var(--line2)}
.acc .inner{padding:6px 16px 16px}

/* rules */
.rules{display:flex;flex-direction:column}
.rules .row{display:flex;justify-content:space-between;gap:14px;align-items:baseline;
   padding:11px 2px;border-bottom:1px dashed var(--line)}
.rules .row:last-child{border-bottom:none}
.rules .row .l{color:var(--muted);font-size:12.5px;font-weight:500;flex:0 0 auto;max-width:44%}
.rules .row .v{color:var(--ink);font-size:14px;font-weight:700;text-align:right;font-family:var(--disp)}

/* steps */
.steps{list-style:none;counter-reset:s;margin-top:4px}
.steps li{position:relative;padding:2px 2px 16px 40px;counter-increment:s}
.steps li::before{content:counter(s);position:absolute;left:0;top:0;width:26px;height:26px;
   border-radius:50%;background:var(--ac);color:#fff;font-family:var(--disp);font-weight:700;
   font-size:13px;display:grid;place-items:center}
.steps.check li::before{content:"✓";font-size:14px}
.steps li:not(:last-child)::after{content:"";position:absolute;left:13px;top:28px;bottom:2px;
   width:2px;background:var(--ac-soft)}
.steps li h4{font-family:var(--disp);font-weight:700;font-size:14.5px}
.steps li p{color:var(--ink2);font-size:13px;margin-top:2px}

/* screenshot with pins */
.shot-wrap{margin:8px auto 4px;max-width:224px}
.shot{position:relative;border-radius:20px;overflow:hidden;border:1px solid var(--line);
   box-shadow:var(--shadow);background:#fff}
.shot img{display:block;width:100%;height:auto}
.pin{position:absolute;transform:translate(-50%,-50%);width:30px;height:30px;border-radius:50%;
   background:var(--ac);color:#fff;font-family:var(--disp);font-weight:700;font-size:15px;
   display:grid;place-items:center;border:2.5px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,.28);z-index:2}
.pin::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--ac);
   opacity:.5;animation:ping 1.9s cubic-bezier(0,0,.2,1) infinite}
@keyframes ping{0%{transform:scale(.85);opacity:.55}70%,100%{transform:scale(1.5);opacity:0}}
.shot-cap{text-align:center;color:var(--muted);font-size:11.5px;margin-top:8px}
.legend{margin-top:10px;display:flex;flex-direction:column}
.legend .li{display:flex;gap:9px;align-items:flex-start;padding:8px 2px;border-bottom:1px solid var(--line2)}
.legend .li:last-child{border-bottom:none}
.legend .li .num{width:20px;height:20px;flex:0 0 auto;border-radius:50%;background:var(--ac);color:#fff;
   font-family:var(--disp);font-weight:700;font-size:11.5px;display:grid;place-items:center;margin-top:1px}
.legend .li h4{font-family:var(--disp);font-weight:700;font-size:13px;color:var(--ink)}
.legend .li p{font-size:12px;color:var(--ink2);margin-top:1px}

/* swipe carousel */
.carousel-wrap{margin:8px 0 2px}
.carousel{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.carousel::-webkit-scrollbar{display:none}
.cslide{flex:0 0 100%;scroll-snap-align:center;box-sizing:border-box}
.cdots{display:flex;justify-content:center;gap:6px;margin-top:12px}
.cdots .cdot{width:7px;height:7px;border-radius:50%;background:var(--line);transition:background .2s,width .2s}
.cdots .cdot.on{background:var(--ac);width:18px;border-radius:4px}
.cswipe{text-align:center;color:var(--muted);font-size:11px;margin-top:7px;letter-spacing:.04em}
.splash{position:fixed;inset:0;z-index:80;background:rgba(244,245,247,.94);backdrop-filter:blur(2px);
   display:flex;align-items:center;justify-content:center}
.splash .sp-in{display:flex;flex-direction:column;align-items:center;gap:12px;color:var(--ink2);font-size:13px;font-weight:700}
.splash .sp-dot{width:26px;height:26px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--ink);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* note */
.note{display:flex;gap:10px;background:var(--ac-soft);border-radius:12px;padding:12px 14px;margin-top:12px}
.note .i{flex:0 0 auto;width:20px;height:20px;border-radius:50%;background:var(--ac);color:#fff;
   font-weight:700;font-size:12px;display:grid;place-items:center;margin-top:1px;font-family:var(--disp)}
.note p{font-size:12.5px;color:var(--ac-ink);line-height:1.65}
.note .nb{flex:1;min-width:0}
.jumpbtn{display:inline-flex;align-items:center;gap:6px;margin-top:9px;padding:7px 13px;border-radius:999px;border:1px solid var(--ac);background:var(--surface,#fff);color:var(--ac-ink);font-size:12px;font-weight:700;font-family:inherit;cursor:pointer;line-height:1.3}
a.jumpbtn{text-decoration:none}
.jumpbtn.big{display:flex;width:100%;justify-content:center;gap:8px;margin-top:12px;padding:14px 16px;border-radius:14px;border:none;background:var(--ac);color:#fff;font-size:14.5px;box-shadow:0 4px 14px rgba(20,22,31,.12)}
.jumpbtn.big .jb-go{font-size:18px}
.jumpbtn .jb-go{font-size:14px;line-height:1}
.jumpwrap{margin-top:4px}
.note.warn{--ac:#C7502F;--ac-soft:#FBEDE8;--ac-ink:#8a3016}

/* sticky jump chips */
.jump{position:sticky;top:51px;z-index:15;display:flex;gap:7px;overflow-x:auto;
   padding:10px 16px;background:rgba(238,240,244,.88);backdrop-filter:blur(10px);
   border-bottom:1px solid var(--line);scrollbar-width:none}
.jump::-webkit-scrollbar{display:none}
.jump button{white-space:nowrap;border:1px solid var(--line);background:#fff;color:var(--ink2);
   font-family:inherit;font-size:12.5px;font-weight:700;padding:6px 13px;border-radius:999px;cursor:pointer;flex:0 0 auto}
.jump button:active{background:var(--ac-soft);color:var(--ac-ink);border-color:var(--ac)}
.acc{scroll-margin-top:106px}

/* install link button & QR */
.linkbtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
   background:var(--ac);color:#fff;font-family:var(--disp);font-weight:700;font-size:14.5px;
   padding:14px 16px;border-radius:12px;text-decoration:none;margin:12px 0 4px;box-shadow:var(--shadow-sm)}
.linkbtn:active{opacity:.9}
.linkbtn svg{width:17px;height:17px}
.qrbox{display:flex;flex-direction:column;align-items:center;gap:8px;margin:12px 0 4px}
.qrbox img{width:190px;height:190px;background:#fff;padding:10px;border-radius:12px;border:1px solid var(--line)}
.qrbox small{color:var(--muted);font-size:11.5px;text-align:center;max-width:26ch}

/* search */
.search-trigger{display:flex;align-items:center;justify-content:flex-start;gap:10px;width:calc(100% - 32px);margin:14px 16px 2px;
   background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:13px 15px;
   cursor:pointer;box-shadow:var(--shadow-sm);font-family:inherit;text-align:left}
.search-trigger:active{background:var(--line2)}
.search-trigger .mag{color:var(--muted);display:grid;place-items:center}
.search-trigger .mag svg{width:19px;height:19px}
.search-trigger .ph{flex:1;min-width:0;color:var(--muted);font-size:14px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search{position:fixed;inset:0;z-index:60;background:var(--bg);display:none;flex-direction:column}
.search.on{display:flex;animation:fade .16s ease both}
@media(min-width:520px){.search{position:absolute}}
.search-bar{display:flex;align-items:center;gap:9px;padding:14px 14px;background:var(--surface);border-bottom:1px solid var(--line)}
.search-bar .mag{color:var(--muted);display:grid;place-items:center}
.search-bar .mag svg{width:19px;height:19px}
.search-bar input{flex:1;min-width:0;border:none;outline:none;font-family:inherit;font-size:16px;background:none;color:var(--ink)}

<label><input type="checkbox">機材（端末・三脚・照明・マイク）の充電とストレージを確認した</label>

        {type:"acc", group:"撮る前に", chapter:"01 撮影前の準備", title:"機材リスト", blocks:[
          {type:"html", html:`<div class="sg"><div class="sg-subhead"><span class="sg-pill sg-must">MUST</span>必ず用意したいもの</div>
<div class="sg-rules">
<div class="sg-row"><div class="sg-h"><b>📱 撮影端末</b><span class="sg-tag">スマホ（縦持ち固定）</span></div><p>基本は標準の1倍で撮る。引きで撮るのが難しい場合は広角でもOK</p><div class="sg-pt"><b>POINT</b>　画面の端ほど歪むので2人とも中央寄りに収める。</div></div>
<div class="sg-row"><div class="sg-h"><b>📷 撮影アプリ</b><span class="sg-tag">標準のカメラアプリ</span></div><p>画質を保つため、標準のカメラアプリ（ノーマルカメラ）で撮る。</p><div class="sg-pt"><b>POINT</b>　加工が必要な場合は、撮影後または編集後に行う。</div></div>
<div class="sg-row"><div class="sg-h"><b>🦯 固定器具</b><span class="sg-tag">三脚 or スマホホルダー</span></div><p>手ぶれ防止、画角固定のため、三脚やホルダーで固定して撮る。</p></div>
<div class="sg-row"><div class="sg-h"><b>💾 ストレージ</b><span class="sg-tag">空き1GB以上</span></div><p>施術中の撮影は長回しになりがちなため、事前に確認。</p></div>
</div>
<div class="sg-subhead sg-sep"><span class="sg-pill sg-want">WANT</span>できたら用意したいもの</div>
<div class="sg-rules">
<div class="sg-row"><div class="sg-h"><b>💡 照明</b><span class="sg-tag">リングライト / LEDライト</span></div><p>表情が暗く映らないように使用する。</p></div>
<div class="sg-row"><div class="sg-h"><b>🎙️ 音声</b><span class="sg-tag">ピンマイク（2人分）</span></div><p>内蔵マイクは環境音や周りの話し声を拾いやすい。会話シーンは特にピンマイクを使う。</p></div>
</div></div>`}
        ]},
        {type:"acc", group:"撮る前に", chapter:"01 撮影前の準備", title:"撮影場所のセッティング", blocks:[
          {type:"html", html:`<div class="sg"><ol class="steps">
<li><h4>背景を整える</h4><p>私物やタオル・道具など生活感のあるものを片付け、画面に映る情報量を減らす。</p></li>
<li><h4>スマホ・三脚を置くスペースを確保</h4><p>撮影中にぐらつかないよう、安定して固定できる場所を事前に決めておく。</p></li>
<li><h4>明るさを確認</h4><p>自然光＋人工照明を組み合わせる。顔も手元も暗すぎ・白飛びしていないか、逆光になっていないかを確認。</p></li>
<li><h4>鏡の映り込みに注意</h4><p>スタッフや他のお客様が意図せず映らないよう角度を調整。</p></li>
</ol></div>`}
        ]},

          {type:"html", html:`<div class="sg"><div class="note warn"><span class="i">!</span><p><b>「顔出し可否」は毎回・撮影の直前に確認する。</b>前回OKでも当日変わることがある。</p></div>
<div class="note"><span class="i">i</span><p>美容師自身の服装・髪型・爪などの身だしなみも、撮影前に整えておく。</p></div></div>`}
        ]},
        {type:"acc", group:"撮る前に", chapter:"02 画角・構図の基本ルール", title:"美容師が動画に映るべき理由", blocks:[
          {type:"html", html:`<div class="sg"><div class="sg-why">
<div class="sg-why-card"><span class="sg-why-ic">🙋</span><b>指名は「人」で決まる</b><p>見た人は技術だけでなく「この人にお願いしたい」で選ぶ。<br>顔や話し方が伝わって、はじめて指名につながる。</p><div class="sg-why-key">「お客様が映っていれば大丈夫」ではなく、<br>美容師が映ってこそのカウンセリング動画。</div></div>
</div></div>`}
        ]},
        {type:"acc", group:"撮る前に", chapter:"02 画角・構図の基本ルール", title:"縦型9:16とセーフゾーン", blocks:[
          {type:"html", html:`<div class="sg"><div class="sg-fig">
<div class="sg-phone">
<img src="images/shoot-1.jpg" alt="9:16の縦型で撮影したカウンセリング動画の撮影例。美容師とお客様が画面中央に収まっている">
<div class="sg-zone sg-top"><b>上15%</b>テロップ・UIで隠れやすい</div>
<div class="sg-zone sg-safe"><span>セーフゾーン</span></div>
<div class="sg-zone sg-bot"><b>下20%</b>テロップ・UIで隠れやすい</div>
</div>
<div class="sg-cap"><b>比率 9:16（縦持ち固定）</b><br>美容師とお客様を中央のセーフゾーンに収める。<br>引き気味に余白を取れば、編集で「引き」と「アップ」の両方が作れる</div>
</div>
<div class="sg-subhead">撮影素材と完成動画を比べると</div>
<div class="sg-two sg-cmp">
<div class="sg-col"><div class="sg-hh"><span class="sg-badge-raw">撮影素材</span></div><img class="sg-shot9" src="images/shoot-2.jpg" alt="撮影素材：引きで撮影した元の映像"><p>美容師とお客様の全体が入る引きで撮り、上下左右に余白を残す。</p></div>
<div class="sg-col"><div class="sg-hh"><span class="sg-badge-edit">完成動画</span></div><img class="sg-shot9" src="images/shoot-3.jpg" alt="完成動画：アップに切り出してテロップを入れた編集後の映像"><p>編集で顔まわりにアップして切り出し、下にテロップが入る。</p></div>
</div>
<div class="note"><span class="i">i</span><p><b>最初からアップで撮ると、編集で切り出す余地がなくなる。</b>引きで撮っておけば、アップにもテロップ入れにも対応できる。</p></div>
<ol class="steps">
<li><h4>比率は9:16</h4><p>スマホは必ず縦持ちで固定する。</p></li>
<li><h4>被写体を画面中央に置く</h4><p>上15%・下20%は隠れやすいので、枠外にならないように確認する。</p></li>
<li><h4>引き気味に余白を多めに撮る</h4><p>編集で「引きの画」と「アップの画」の両方が作れる。距離が取れないときは広角にしてもOK。</p></li>
</ol>
<div class="note"><span class="i">i</span><p><b>迷ったら中央＆引き気味でOK。</b>余白があれば編集で引きとアップ両方の絵を作れて、クオリティが上がる。</p></div></div>`}
        ]},
        {type:"acc", group:"撮る前に", chapter:"02 画角・構図の基本ルール", title:"お客様と美容師の立ち位置", blocks:[
          {type:"html", html:`<div class="sg"><p class="sg-txt">施術中は美容師も体の向きや高さを変えながら動き続けるので、意識していないと少しずつフレームから外れていく。</p>
<div class="sg-two">
<div class="sg-col sg-ng"><img class="sg-shot" src="images/shoot-4.jpg" alt="NG例：美容師の顔が画面の上に見切れている"><div class="sg-hh"><span class="sg-badge-ng">NG</span>いつのまにか画角の外</div><ul><li>最初の画角調整でお客様しか確認していない</li><li>施術中に動いて、位置が少しずつズレる</li></ul></div>
<div class="sg-col sg-ok"><img class="sg-shot" src="images/shoot-5.jpg" alt="OK例：美容師とお客様の2人が画面に収まっている"><div class="sg-hh"><span class="sg-badge-ok">OK</span>目印に立ち位置を戻す</div><ul><li>鏡の枠や床のタイルなど、動かない目印を1つ決める</li><li>動いても、その目印を基準に戻す</li></ul></div>
</div>
<div class="note warn"><span class="i">!</span><p><b>「お客様が映っていれば大丈夫」が一番危ない。</b>画角チェックはお客様だけでなく自分も。</p></div>
<div class="note"><span class="i">i</span><p>画角はやや広め（引き気味）にしておくと、多少動いても見切れにくい。時々「まだ目印の範囲にいるか」をセルフチェックする習慣を。</p></div></div>`}
        ]},
        {type:"acc", group:"撮る前に", chapter:"02 画角・構図の基本ルール", title:"基本のカメラ位置（全シーン共通・固定）", blocks:[
          {type:"html", html:`<div class="sg"><p class="sg-txt">カメラは基本、鏡の前か横にセット。装着編・取り外し編とも、シーンが変わってもカメラの位置は基本的に動かさない。三脚を立てたら、その位置のまま最初から最後まで撮り切る。</p>
<ol class="steps">
<li><h4>カメラ位置</h4><p>カメラは基本、<b>鏡の前か鏡の横</b>にセットする。正面〜斜め45度の角度から、お客様と美容師の顔が見えるように撮る。</p></li>
<li><h4>距離感：約1m</h4><p>美容師とお客様の2人が画面に入るくらい。距離が取れず入りきらないときは広角にしてもOK（端は歪むので人は中央寄りに）。撮影を始める前に、美容師がお客様の横に回っても見切れないか一度確認する。</p></li>
<li><h4>動かさない</h4><p>シーンが変わってもこの位置のまま、最初から最後まで撮り切る。</p></li>
</ol></div>`}
        ]},
        {type:"acc", group:"撮る前に", chapter:"02 画角・構図の基本ルール", title:"技術保護のための撮影ルール", blocks:[
          {type:"html", html:`<div class="sg"><p class="sg-txt">施術の技術情報や製品、そして美容師さん自身を守るためのルール。手元のクローズアップは禁止だが、「引き」の画角でパッと見て工程がわからない撮り方なら基本的に問題なし。</p>
<div class="sg-two sg-stack">
<div class="sg-col sg-ng"><div class="sg-hh"><span class="sg-badge-ng">NG</span>手元のクローズアップ・接写</div><p>装着・取り外しの結び目や道具の使い方が特定できる手元の接写。スロー再生や倍率を上げて工程が読み取れるカットも同様にNG。</p></div>
<div class="sg-col sg-ok"><div class="sg-hh"><span class="sg-badge-ok">OK</span>「引き」の画角にとどめる</div><p>手元は背景でぼんやり動く程度に。画面の主役はあくまで美容師の表情・会話。この距離感を守れていれば基本的にOK。</p></div>
</div>
<div class="note"><span class="i">i</span><p>カメラは美容師の顔が正面〜斜めに見える位置に置き、手元は画角の端か背景に収める。</p></div>
<div class="note" style="--ac:#2C9E68;--ac-soft:#E8F4EC;--ac-ink:#1c6642"><span class="i">✓</span><p>カット・カラーなど<b>プルエクステ以外のサロンワークの手元アップは問題なし。</b>技術保護の対象外なので、別の見せ場として活用する。</p></div></div>`}
        ]},
        {type:"acc", group:"撮る前に", chapter:"03 撮影前に知っておくNG", title:"NGリスト", blocks:[
          {type:"html", html:`<div class="sg"><div class="sg-ngtbl">
<div class="sg-it"><div class="sg-t">🛡️ 技術保護（製品・美容師を守る）</div>
<div class="sg-r"><span class="sg-badge-ng">NG</span>手元を大きく写す接写、結び方が特定できるクローズアップ</div>
<div class="sg-r"><span class="sg-badge-ok">OK</span>「引き」の画角にとどめれば基本OK。表情・会話を厚くする</div></div>
<div class="sg-it"><div class="sg-t">🪞 映り込み</div>
<div class="sg-r"><span class="sg-badge-ng">NG</span>私物や生活感のあるもの、他のお客様の顔が映り込む</div>
<div class="sg-r"><span class="sg-badge-ok">OK</span>背景を片付けて情報量を減らし、映り込むものは画角から外す</div></div>
<div class="sg-it"><div class="sg-t">🔒 同意・プライバシー</div>
<div class="sg-r"><span class="sg-badge-ng">NG</span>顔出し可否を確認せずに撮る</div>
<div class="sg-r"><span class="sg-badge-ok">OK</span>毎回顔出し可否を確認し、NGの場合もお客様は普段通り画角に入れて撮り、あとでモザイク処理する</div></div>
<div class="sg-it"><div class="sg-t">📐 画角・撮影姿勢</div>
<div class="sg-r"><span class="sg-badge-ng">NG</span>暗すぎる画角、逆光、手ブレの多用</div>
<div class="sg-r"><span class="sg-badge-ok">OK</span>明るさを確認し、カメラ位置を固定して撮る</div></div>
<div class="sg-it"><div class="sg-t">✨ 表現・誇張</div>
<div class="sg-r"><span class="sg-badge-ng">NG</span>Before/Afterの加工・角度変更による過度な誇張</div>
<div class="sg-r"><span class="sg-badge-ok">OK</span>同アングル・同条件で撮影し、自然な変化を見せる</div></div>
</div></div>`}
        ]},
        {type:"acc", group:"撮影本番", chapter:"✅ チェックリスト", title:"撮影中のチェック", blocks:[
          {type:"html", html:`<div class="sg"><div class="sg-cl">
<label><input type="checkbox">Before／Afterは同じアングル・同じ明るさで撮った</label>
<label><input type="checkbox">手元は引きの画角にとどめ、技術が特定できるクローズアップになっていない</label>
<label><input type="checkbox">顔出しNGのお客様も普段通り画角に入れて撮り、美容師が見切れていないか確認した</label>
<label><input type="checkbox">表情・会話・雑談など、プルエクステに関するカットを撮った</label>
</div></div>`}
        ]},
        {type:"acc", group:"撮影本番", chapter:"04 撮影の流れ", title:"いきなり動画より、まず写真から", blocks:[
          {type:"html", html:`<div class="sg"><p class="sg-txt">動画をいきなりお願いすると身構えられやすい。来店してすぐのタイミングで先に写真の許可をもらい、その流れで動画に広げると通りやすい。</p>
<div class="note"><span class="i">★</span><p><b>ねらい目：自分の動画を見て来店してくれたお客様は、撮影に協力してくれることが多い。最初に来店理由を聞けると、交渉の糸口になる。</b></p></div>
<div class="sg-subhead">パターン1：スタイル写真から</div>
<div class="sg-pitch"><div class="sg-q">「今日仕上がったら、お写真だけ撮らせてもらえますか？」</div><div class="sg-ar">▼</div><div class="sg-q sg-b">「もし良ければ、少しだけ動画撮影にご協力いただけませんか？」</div></div>
<div class="sg-subhead">パターン2：Before/After写真から</div>
<div class="sg-pitch"><div class="sg-q">「Before/Afterの写真を撮らせてください」</div><div class="sg-ar">▼</div><div class="sg-q sg-b">「動きも伝わるので、もし良ければ動画撮影にもご協力いただけませんか？」</div></div>

          {type:"html", html:`<div class="sg"><p class="sg-txt">顔が映る通常の画角で撮るのが基本。顔出しNGはあくまで例外対応で、その場合だけ撮り方を少し工夫する。</p>

  const leg=(b.legend||[]).map(l=>`<div class="li"><span class="num">${l.n}</span><div><h4>${esc(T(l.tidH,l.h))}</h4><p>${esc(T(l.tidP,l.p))}</p></div></div>`).join('');
  const cap=T(b.tidCap,b.cap);
  return `<div class="shot-wrap"><div class="shot"><img src="${b.img}" alt="操作画面">${pins}</div>${cap?`<div class="shot-cap">${esc(cap)}</div>`:''}</div>${leg?`<div class="legend">${leg}</div>`:''}`;
}
function jumpBtn(j){ return `<button class="jumpbtn${j.big?' big':''}" data-jsid="${esc(j.sid)}" data-jtitle="${esc(j.title)}">${esc(j.label)}<span class="jb-go">›</span></button>`; }
function jumpTo(sid,title){
  const s=CONTENT.services.find(x=>x.id===sid); if(!s) return;
  const ai=orderedAccs(s).findIndex(a=>a.title===title);
  openSearchResult(sid, ai);
}
document.addEventListener('click',e=>{ const j=e.target.closest('[data-jsid]'); if(j){ e.preventDefault(); jumpTo(j.dataset.jsid,j.dataset.jtitle); } });
function block(b){
  if(b.type==="html") return b.html;
  if(b.type==="lead") return `<p class="lead">${esc(T(b.tid,b.text))}</p>`;
  if(b.type==="note") return `<div class="note ${b.tone==='warn'?'warn':''}"><span class="i">${b.tone==='warn'?'!':'i'}</span>${b.jump?`<div class="nb"><p>${esc(T(b.tid,b.text))}</p>${jumpBtn(b.jump)}</div>`:`<p>${esc(T(b.tid,b.text))}</p>`}</div>`;
  if(b.type==="jump") return `<div class="jumpwrap">${b.href?`<a class="jumpbtn" href="${esc(b.href)}">${esc(b.label)}<span class="jb-go">›</span></a>`:jumpBtn(b)}</div>`;
  if(b.type==="subhead") return `<div class="subhead">${esc(b.text)}</div>`;
  if(b.type==="linkbtn") return `<a class="linkbtn" href="${esc(b.href)}" target="_blank" rel="noopener">${esc(b.label)}</a>`;
  if(b.type==="qr") return `<div class="qrbox"><img src="${b.img}" alt="QRコード">${b.cap?`<small>${esc(b.cap)}</small>`:''}</div>`;
  if(b.type==="rules") return `<div class="rules">${b.rows.map(r=>`<div class="row"><span class="l">${esc(r[0])}</span><span class="v">${esc(T(r[2],r[1]))}</span></div>`).join('')}</div>`;
  if(b.type==="steps") return `<ol class="steps ${b.check?'check':''}">${b.steps.map(s=>`<li><h4>${esc(T(s.tidH,s.h))}</h4><p>${esc(T(s.tidP,s.p))}</p></li>`).join('')}</ol>`;
  if(b.type==="shot"){ return shotHtml(b); }
  if(b.type==="carousel"){
    const slides=b.items.map(it=>`<div class="cslide">${shotHtml(it)}</div>`).join('');
    const dots=b.items.map((_,i)=>`<span class="cdot${i===0?' on':''}"></span>`).join('');
    return `<div class="carousel-wrap"><div class="carousel">${slides}</div><div class="cdots">${dots}</div><div class="cswipe">← スワイプで切り替え →</div></div>`;
  }
  if(b.type==="acc"){
    return `<details class="acc locked" ${b.nav?`data-nav="${esc(b.nav)}"`:''} open><summary><span class="dot"></span>${esc(T(b.tid,b.title))}</summary><div class="inner">${b.blocks.map(block).join('')}</div></details>`;
  }
  return '';
}

function renderHome(){
  const c=CONTENT;
  const cards=c.services.filter(s=>!s.hidden).map(s=>`
    <button class="card ${s.stub?'stub':''}" data-id="${s.id}" data-accent="${s.accent}">
      <span class="chip">${s.icon}</span>
      <span class="tx"><h3>${esc(s.label)}</h3><small>${esc(s.sub)}</small></span>
      ${s.stub?'<span class="badge">準備中</span>':`<span class="go">${CHEV}</span>`}
    </button>`).join('');
  return `<div class="home" id="home">
    <div class="hero">
      <h1>${esc(c.brand.title)}</h1>
    </div>
    <details class="intro" open>
      <summary>C1アプリ 3つの機能<span class="cv">▼</span></summary>
      <div class="pillars">
        <div class="pillar"><span class="pic">🎓</span><b>技術取得<br>サポート</b><span class="pbadge all">全スタッフ</span></div>
        <div class="pillar"><span class="pic">📱</span><b>SNS投稿<br>促進サポート</b><span class="pbadge all">全スタッフ</span></div>
        <div class="pillar"><span class="pic">✂️</span><b>動画作成<br>サポート</b><span class="pbadge inv">招待制</span></div>
      </div>
    </details>
    <button class="search-trigger" id="searchOpen">
      <span class="mag">${MAG}</span>
      <span class="ph">キーワードで検索</span>
    </button>
    <div class="sec-label">サービス・使い方</div>
    <div class="cards">${cards}</div>
    <div class="foot">C1アプリは常にバージョンアップ中のため、仕様が変更になる場合があります。<br>この資料は関係者限定です。</div>
  </div>
  <div class="detail" id="detail"></div>
  <div class="search" id="search">
    <div class="search-bar">
      <span class="mag">${MAG}</span>
      <input id="searchInput" type="search" inputmode="search" autocomplete="off" placeholder="キーワードで検索">
      <button id="searchClose">キャンセル</button>
    </div>
    <div class="search-results" id="searchResults"></div>
  </div>`;
}

function tabOrder(accs){ const seen=[]; accs.forEach(a=>{ if(a.group && !seen.includes(a.group)) seen.push(a.group); }); const pri=["詳細","使い方"]; seen.sort((a,b)=>{ const ia=pri.indexOf(a), ib=pri.indexOf(b); if(ia<0&&ib<0) return 0; if(ia<0) return 1; if(ib<0) return -1; return ia-ib; }); return seen; }
function orderedAccs(s){
  const accs=s.blocks.filter(b=>b.type==='acc');
  const tabs=tabOrder(accs);
  if(tabs.length>1){ let out=[]; tabs.forEach(g=>{ out=out.concat(accs.filter(a=>a.group===g)); });
    accs.forEach(a=>{ if(!out.includes(a)) out.push(a); }); return out; }
  return accs;
}
function renderBody(s){
  const pre=s.blocks.filter(b=>b.type!=='acc');
  const accs=s.blocks.filter(b=>b.type==='acc');
  let html=pre.map(block).join('');
  const tabs=tabOrder(accs);
  if(tabs.length>1){
    html+=`<div class="tabwrap"><div class="tabs">`+tabs.map((g,i)=>`<button class="tab${i===0?' on':''}" data-tab="${esc(g)}">${esc(g)}</button>`).join('')+`</div></div>`;
    tabs.forEach((g,i)=>{ const items=accs.filter(a=>a.group===g);
      html+=`<div class="tabpanel${i===0?' on':''}" data-panel="${esc(g)}">`+items.map((a,k)=>(a.chapter&&(k===0||items[k-1].chapter!==a.chapter)?`<div class="chap">${esc(a.chapter)}</div>`:'')+block(a)).join('')+`</div>`; });
  } else { html+=accs.map(block).join(''); }
  return html;
}
function openDetail(id){
  const s=CONTENT.services.find(x=>x.id===id); if(!s)return;
  const d=document.getElementById('detail');
  d.setAttribute('data-accent',s.accent);
  d.innerHTML=`
    <div class="topbar"><button class="crumb-back" id="back">${BACK}<span>ホーム</span></button><span class="crumb-sep">›</span><span class="crumb-now">${esc(s.label)}</span><button class="topbar-search" id="detailSearch" aria-label="検索">${MAG}</button></div>
    <div class="d-head"><span class="ki">${s.icon}</span><h2>${esc(s.label)}</h2><div class="sub">${esc(s.sub)}</div></div>
    <div class="d-body">${renderBody(s)}</div>`;
  document.getElementById('home').classList.add('off');
  d.classList.add('on');
  const allAccs=[...d.querySelectorAll('.acc')];
  allAccs.forEach((a,i)=>a.id='sec'+i);
  d.querySelectorAll('.carousel').forEach(car=>{
    const dots=car.parentElement.querySelectorAll('.cdot');
    car.addEventListener('scroll',()=>{
      const i=Math.round(car.scrollLeft/car.clientWidth);
      dots.forEach((dt,j)=>dt.classList.toggle('on',j===i));
    },{passive:true});
  });
  const tabbar=d.querySelector('.tabs');
  if(tabbar){
    tabbar.querySelectorAll('.tab').forEach(t=>{ t.onclick=()=>{
      const g=t.dataset.tab;
      tabbar.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===t));
      d.querySelectorAll('.tabpanel').forEach(p=>p.classList.toggle('on',p.dataset.panel===g));
      window.scrollTo(0,0); app.scrollTop=0;
    }; });
  } else {
    const navAccs=allAccs.filter(a=>a.dataset.nav);
    if(navAccs.length>1){
      const bar=document.createElement('div'); bar.className='jump';
      navAccs.forEach(a=>{
        const btn=document.createElement('button'); btn.textContent=a.dataset.nav;
        btn.onclick=()=>{ a.open=true; a.scrollIntoView({behavior:'smooth',block:'start'}); };
        bar.appendChild(btn);
      });
      d.querySelector('.topbar').after(bar);
    }
  }
  document.getElementById('back').onclick=()=>{showHome();};
  const dse=document.getElementById('detailSearch'); if(dse) dse.onclick=openSearch;
  window.scrollTo(0,0); app.scrollTop=0;
}
function showHome(){
  document.getElementById('detail').classList.remove('on');
  document.getElementById('home').classList.remove('off');
  window.scrollTo(0,0); app.scrollTop=0;
}

function route(){ showHome(); }
app.addEventListener('click',e=>{
  const card=e.target.closest('.card'); if(card){openDetail(card.dataset.id);}
});

/* ---------- search ---------- */
const MAG_INDEX=[];
function accText(b){
  const t=[b.title];
  (b.blocks||[]).forEach(x=>{
    if(x.type==='lead'||x.type==='note') t.push(x.text);
    else if(x.type==='rules') x.rows.forEach(r=>t.push(r[0]+' '+r[1]));
    else if(x.type==='steps') x.steps.forEach(s=>t.push(s.h+' '+s.p));
    else if(x.type==='shot'){ if(x.cap)t.push(x.cap); (x.legend||[]).forEach(l=>t.push(l.h+' '+l.p)); }
    else if(x.type==='carousel'){ (x.items||[]).forEach(it=>{ if(it.cap)t.push(it.cap); (it.legend||[]).forEach(l=>t.push(l.h+' '+l.p)); }); }
    else if(x.type==='qr'&&x.cap) t.push(x.cap);
    else if(x.type==='linkbtn') t.push(x.label);
    else if(x.type==='html') t.push(x.html.replace(/<[^>]+>/g,' ').replace(/\s+/g,' '));
  });
  return t.join(' ');
}
function buildIndex(){
  CONTENT.services.forEach(s=>{
    const leadText=s.blocks.filter(b=>b.type==='lead').map(b=>b.text).join(' ');
    addEntry(s,'', -1, s.label+' '+s.sub+' '+leadText);
    orderedAccs(s).forEach((b,i)=>{ addEntry(s,b.title,i, s.label+' '+accText(b)); });
  });
}
function addEntry(s,title,ai,text){
  MAG_INDEX.push({sid:s.id,slabel:s.label,icon:s.icon,accent:s.accent,title:title,ai:ai,
    text:text, ctext:cmp(text), ctitle:cmp(title), clabel:cmp(s.label)});
}
function cmp(s){ return (s||'').toLowerCase().replace(/[\s　（）()「」【】・,、。／\/：:＞>･\-]/g,''); }
function grams(cq){ if(cq.length<=1) return [cq]; const g=[]; for(let i=0;i<cq.length-1;i++)g.push(cq.slice(i,i+2)); return [...new Set(g)]; }
function score(e,cq,gs){
  let s=0,m=0;
  gs.forEach(g=>{ const c=e.ctext.split(g).length-1; if(c>0){ m++; s+=Math.min(c,3); } });
  if(m===0) return 0;
  s += (m/gs.length)*10;
  if(e.ctext.includes(cq)) s+=15;
  if(e.clabel.includes(cq)) s+=25;
  if(e.ctitle && e.ctitle.includes(cq)) s+=30;
  return s;
}
function reEsc(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }
function hl(text,q){
  const raw=(q||'').trim(); if(!raw) return esc(text);
  const ns=[...new Set([raw, ...raw.split(/\s+/)].filter(Boolean))].sort((a,b)=>b.length-a.length).map(n=>reEsc(esc(n)));
  if(!ns.length) return esc(text);
  try{ return esc(text).replace(new RegExp('('+ns.join('|')+')','gi'),'<mark>$1</mark>'); }catch(e){ return esc(text); }
}
function snippet(text,q){
  const tl=text.toLowerCase(); let i=tl.indexOf(q.toLowerCase());
  if(i<0){ const cq=cmp(q); const g=cq.length>=2?cq.slice(0,2):cq; i=tl.indexOf(g); }
  if(i<0) return '';
  const a=Math.max(0,i-12), b=Math.min(text.length,i+Math.max(q.length,6)+22);
  return (a>0?'…':'')+text.slice(a,b).trim()+(b<text.length?'…':'');
}
const SC_CHIPS=['ポイント交換','プロモート','課題提出','技術カルテ','ディプロマ'];
function renderSearch(q){
  const box=document.getElementById('searchResults'); q=(q||'').trim();
  if(!q){ box.innerHTML='<div class="search-hint">よく調べる項目</div><div class="sc-chips">'+SC_CHIPS.map(k=>`<button class="sc-chip" data-k="${esc(k)}">${esc(k)}</button>`).join('')+'</div>'; return; }
  const cq=cmp(q); if(!cq){ box.innerHTML=''; return; }
  const gs=grams(cq);
  const scored=MAG_INDEX.map(e=>({e,sc:score(e,cq,gs)})).filter(x=>x.sc>0).sort((a,b)=>b.sc-a.sc);
  const top=scored.length?scored[0].sc:0;
  const perSec={}, out=[];
  for(const x of scored){ if(x.sc<top*0.28) break; const n=perSec[x.e.sid]||0; if(n>=3) continue; perSec[x.e.sid]=n+1; out.push(x.e); if(out.length>=10) break; }
  if(!out.length){ box.innerHTML='<div class="search-hint">「'+esc(q)+'」に一致する項目は見つかりませんでした</div>'; return; }
  const groups=[], gm={};
  out.forEach(e=>{ if(!gm[e.sid]){ gm[e.sid]={slabel:e.slabel,icon:e.icon,accent:e.accent,items:[]}; groups.push(gm[e.sid]); } gm[e.sid].items.push(e); });
  box.innerHTML=groups.map(g=>{
    const head=`<div class="sr-head" data-accent="${g.accent}"><span class="sr-hic">${g.icon}</span>${esc(g.slabel)}</div>`;
    const items=g.items.map(e=>{
      const title=e.title||'概要';
      const sn=snippet(e.text,q);
      return `<button class="sr" data-accent="${e.accent}" data-sid="${e.sid}" data-ai="${e.ai}"><span class="tx"><span class="path">${hl(title,q)}</span>${sn?`<span class="snip">${hl(sn,q)}</span>`:''}</span><span class="sr-go">${CHEV}</span></button>`;
    }).join('');
    return `<div class="sr-group" data-accent="${g.accent}">${head}${items}</div>`;
  }).join('');
}
function openSearch(){ const s=document.getElementById('search'); s.classList.add('on'); const i=document.getElementById('searchInput'); i.value=''; renderSearch(''); setTimeout(()=>i.focus(),60); }
function closeSearch(){ document.getElementById('search').classList.remove('on'); }
function openSearchResult(sid,ai){
  closeSearch(); openDetail(sid);
  if(ai>=0){ const d=document.getElementById('detail'); const acc=d.querySelector('#sec'+ai);
    if(acc){
      const panel=acc.closest('.tabpanel');
      if(panel){ const g=panel.dataset.panel; const tb=d.querySelector('.tabs');
        if(tb){ tb.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.dataset.tab===g));
          d.querySelectorAll('.tabpanel').forEach(p=>p.classList.toggle('on',p.dataset.panel===g)); } }
      acc.open=true; setTimeout(()=>acc.scrollIntoView({behavior:'smooth',block:'start'}),70);
    } }
}
buildIndex();
function wireUI(){
  document.getElementById('searchOpen').onclick=openSearch;
  document.getElementById('searchClose').onclick=closeSearch;
  document.getElementById('searchInput').addEventListener('input',e=>renderSearch(e.target.value));
  document.getElementById('searchResults').addEventListener('click',e=>{
    const chip=e.target.closest('.sc-chip');
    if(chip){ const inp=document.getElementById('searchInput'); inp.value=chip.dataset.k; renderSearch(chip.dataset.k); inp.focus(); return; }
    const r=e.target.closest('.sr'); if(r){ openSearchResult(r.dataset.sid, parseInt(r.dataset.ai,10)); }
  });
}
function initUI(){ app.innerHTML=renderHome(); wireUI(); }

/* ---------- content from Google Sheet (via GAS) ---------- */
/* 確認用ビルドではGAS連動をオフ（URL空）。運用移行時にURLを戻します。 */
const GAS_URL="";
function splash(on){
  let el=document.getElementById('splash');
  if(on){ if(!el){ el=document.createElement('div'); el.id='splash'; el.className='splash';
    el.innerHTML='<div class="sp-in"><div class="sp-dot"></div>最新の内容を読み込み中…</div>'; document.body.appendChild(el); } }
  else if(el){ el.remove(); }
}
async function boot(){
  if(!GAS_URL){ initUI(); return; }   // 確認用: 既定テキストで即表示
  try{ const c=JSON.parse(localStorage.getItem('c1texts')||'null'); if(c) TEXTS=c; }catch(e){}
  const hadCache=Object.keys(TEXTS).length>0;
  initUI();
  if(!hadCache) splash(true);
  try{
    const r=await fetch(GAS_URL,{cache:'no-store'});
    const j=await r.json();
    if(j && typeof j==='object'){
      TEXTS=j;
      try{ localStorage.setItem('c1texts',JSON.stringify(j)); }catch(e){}
      const onHome=!document.getElementById('detail').classList.contains('on');
      if(onHome) initUI();
    }
  }catch(e){ /* keep cache/defaults */ }
  splash(false);
}
boot();
</script>
